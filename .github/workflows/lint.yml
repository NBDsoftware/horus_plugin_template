name: Lint

on:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff lint
        run: uv run ruff check my_plugin/

      - name: ruff format
        run: uv run ruff format --check my_plugin/

      - name: mypy
        run: uv run mypy my_plugin/

  frontend:
    name: Frontend (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: biome check
        run: bun run check
