repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        require_serial: true

      - id: biome-format
        name: biome format
        entry: bun run format
        language: system
        files: \.(js|ts|jsx|tsx|json)$
        pass_filenames: false

      - id: biome-lint
        name: biome lint
        entry: bun run check
        language: system
        files: \.(js|ts|jsx|tsx)$
        pass_filenames: false
